# GitHub Actions workflow for IAM policy validation.
# Needs the AWS_ROLE_ARN repository secret (an OIDC role with Access Analyzer
# permissions). Without it the validation jobs are skipped instead of failing.
name: IAM Policy Validation

on:
  pull_request:
    paths:
      - '**/*.json'
      - '**/policies/**'
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - '**/policies/**'

jobs:
  check-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for AWS role secret
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ROLE_ARN is not set; skipping IAM policy validation."
          fi

  validate-policies:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install .

      - name: Validate IAM Policies
        run: |
          set -o pipefail
          python -m access_analyzer.cicd examples/policy-validation 2>&1 | tee validation_output.txt

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && hashFiles('validation_output.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('validation_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## IAM Policy Validation Results\n```\n' + output + '\n```'
            });

  check-cfn-policies:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CFN Policy Validator
        run: pip install cfn-policy-validator

      - name: Validate CloudFormation Templates
        run: |
          for template in $(find . -name "*.yaml" -o -name "*.json" | grep -E "(template|stack)"); do
            echo "Validating $template..."
            cfn-policy-validator validate --template-path "$template" --region us-east-1 || true
          done
